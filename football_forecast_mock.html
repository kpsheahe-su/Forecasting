  section.panel.active { display: block; }

  .w { min-width: 0; overflow: hidden; }

  .surface { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; height: 100%; display: flex; flex-direction: column; }
  .t { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }

  .kpi .big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .t { margin-bottom: 6px; }
  .delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; margin-top: 6px; padding: 2px 8px; border-radius: 999px; }
  .delta.up { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .delta.down { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }

  /* section headings: no box, just a rule with an accent bar */
  .heading { font-size: 15px; font-weight: 700; height: 100%; display: flex; align-items: flex-end; padding: 0 2px 6px; border-bottom: 1px solid var(--line); position: relative; }
  .heading::before { content: ""; position: absolute; left: 0; bottom: -1px; width: 28px; height: 2px; background: var(--accent); border-radius: 2px; }
  .sub { font-size: 12px; color: var(--muted); height: 100%; display: flex; align-items: center; padding: 0 2px; }

  /* filters: quiet chips, no border */
  .chip { height: 100%; display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; box-shadow: var(--shadow); padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip .caret { margin-left: auto; color: var(--muted); }

  svg.chart { width: 100%; flex: 1; min-height: 90px; display: block; overflow: visible; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

  .tbl { overflow: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 8px; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }

  .ph { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; border-radius: 10px; background: repeating-linear-gradient(135deg, transparent 0 9px, var(--line) 9px 10px); }

    .w { margin-bottom: 14px; }
    .w .surface { min-height: 120px; }
    main { padding: 14px; }
    header, nav.tabs { padding-left: 14px; padding-right: 14px; }
  }
</style>

// ---------- deterministic dummy data ----------
let seed = 11;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function series(n, base, amp, trend = 0) {
  return Array.from({ length: n }, (_, i) => Math.max(0, base + trend * i + (rnd() - 0.5) * amp));
}
const fmt = (n, d = 0) => Number(n).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtMoney = n => "$" + (n >= 1e9 ? fmt(n / 1e9, 2) + "B" : n >= 1e6 ? fmt(n / 1e6, 1) + "M" : fmt(n / 1e3, 0) + "K");
const fmtNum = n => (n >= 1e6 ? fmt(n / 1e6, 2) + "M" : n >= 1e3 ? fmt(n / 1e3, 1) + "K" : fmt(n));
const pctTxt = n => (n >= 0 ? "+" : "") + fmt(n, 1) + "%";

// Pick a dummy scale from the widget title so handle, actives and percent charts look right
function kindOf(title, fmtHint) {
  const t = (title || "").toLowerCase();
  if (t.includes("handle") && !t.includes("%") && !t.includes("vs")) return "money";
  if (t.includes("actives") || t.includes("player day") || t.includes("users")) return "num";
  if (fmtHint === "money") return "money";
  return "pct";
}
function dummyValue(kind, title) {
  const r = rnd();
  if (kind === "pct") return { txt: pctTxt((r - 0.45) * 12), up: true };
  if (kind === "money") return { txt: fmtMoney((0.8 + r) * (/total|ytd|cy|ly/i.test(title) ? 2.4e9 : 1.6e7)) };
  return { txt: fmtNum((0.5 + r) * (/total|cy|ly/i.test(title) ? 2.1e6 : 2.2e5)) };
}

// Each curve gets its own level and shape, keyed off its name, so Reax, Retained,
// Actual and Forecast separate instead of stacking on top of each other.
function seriesFor(name, n, base) {
  const s = name.toLowerCase();
  let mult = 1, trend = 0.003, noise = 0.06, wave = 0;
  if (/reax/.test(s)) mult = 1.3;
  if (/retained/.test(s)) mult = 0.72;
  if (/\bly\b|last year/.test(s)) { mult = 0.88; trend = 0.001; noise = 0.03; }
  if (/forecast/.test(s)) { noise = 0.01; wave = 0.06; trend = 0.002; }
  if (/actual|acual|\bcy\b/.test(s)) { noise = 0.16; trend = 0.006; }
  return Array.from({ length: n }, (_, i) =>
    Math.max(0, base * mult * (1 + trend * i + wave * Math.sin(i / 3) + (rnd() - 0.5) * noise)));
}

const LABEL_DAYS = Array.from({ length: 30 }, (_, i) => `11/${String(i + 1).padStart(2, "0")}`);
const LABEL_WEEKS = ["W36","W37","W38","W39","W40","W41","W42","W43","W44","W45","W46","W47"];
const LABEL_HOURS = ["10a","12p","2p","4p","6p","8p","10p","12a"];
function axisFor(w) {
  const x = (w.xlabel || "").toLowerCase();
  if (x.includes("week")) return LABEL_WEEKS;
  if (x.includes("time") || x.includes("hour")) return LABEL_HOURS;
  return LABEL_DAYS;
}

// ---------- charts / tables ----------
const PALETTE = ["#2563eb", "#f59e0b", "#10b981", "#8b5cf6"];

function lineChart(labels, sers, type) {
  const W = 800, H = 210, P = 36, B = 26;
  const all = sers.flatMap(s => s.data);
  const max = (Math.max(...all) || 1) * 1.12;
  const innerW = W - 2 * P, innerH = H - B - 8;
  const x = i => P + (i * innerW) / Math.max(1, labels.length - 1);
  const y = v => 8 + innerH - (v / max) * innerH;
  let body = "";
  for (let g = 0; g <= 3; g++) {
    const gv = (max * g) / 3, gy = y(gv);
    body += `<line x1="${P}" x2="${W - P}" y1="${gy}" y2="${gy}" stroke="var(--line)" stroke-dasharray="${g ? "3 4" : "0"}"/>`;
    body += `<text x="${P - 8}" y="${gy + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${fmt(gv)}</text>`;
  }
  if (type === "bar") {
    const slot = innerW / labels.length;
    const bw = slot / (sers.length + 1.2);
    sers.forEach((s, si) => s.data.forEach((v, i) => {
      const bx = P + i * slot + si * bw + bw * 0.35;
      body += `<rect x="${bx}" y="${y(v)}" width="${bw * 0.85}" height="${Math.max(0, 8 + innerH - y(v))}" fill="${PALETTE[si % 4]}" rx="4"/>`;
    }));
    const step = Math.ceil(labels.length / 10);
    labels.forEach((l, i) => { if (i % step === 0) body += `<text x="${P + i * slot + slot / 2}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${l}</text>`; });
  } else {
    // soft area under the first series for depth
    const first = sers[0];
    if (first) {
      const top = first.data.map((v, i) => `${x(i)},${y(v)}`).join(" L");
      body += `<path d="M${x(0)},${y(0)} L${top} L${x(labels.length - 1)},${y(0)} Z" fill="${PALETTE[0]}" opacity=".08"/>`;
    }
    sers.forEach((s, si) => {
      const pts = s.data.map((v, i) => `${x(i)},${y(v)}`).join(" ");
      body += `<polyline points="${pts}" fill="none" stroke="${PALETTE[si % 4]}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" ${si % 2 ? 'stroke-dasharray="6 5"' : ""}/>`;
    });
    const step = Math.ceil(labels.length / 8);
    labels.forEach((l, i) => { if (i % step === 0) body += `<text x="${x(i)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${l}</text>`; });
  }
  const legend = sers.map((s, si) => `<span style="--c:${PALETTE[si % 4]}">${s.name}</span>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${body}</svg><div class="legend">${legend}</div>`;
}

function renderWidget(w, idx) {
  const box = `grid-column: ${w.x + 1} / span ${w.w}; grid-row: ${w.y + 1} / span ${w.h};`;
  const wrap = inner => `<div class="w" style="${box}">${inner}</div>`;

  if (w.type === "text") {
    return wrap(`<div class="${w.h >= 2 ? "heading" : "sub"}">${escapeHtml(w.text)}</div>`);
  }
  if (w.type.startsWith("filter")) {
    const val = w.type === "filter-date-picker" ? "2026-09-01 → 2026-11-24" : "All";
    return wrap(`<div class="chip">${escapeHtml(w.title || w.field || "Filter")} <b>${val}</b><span class="caret">▾</span></div>`);
  }
  if (w.type === "counter") {
    const kind = w.fmt === "percent" ? "pct" : kindOf(w.title, w.fmt);
    const v = dummyValue(kind, w.title);
    const isPct = kind === "pct";
    const cls = isPct ? (v.txt.startsWith("-") ? "down" : "up") : "up";
    const dl = isPct ? "" : `<div class="delta ${cls}">${pctTxt((rnd() - 0.4) * 8)} vs LY</div>`;
    return wrap(`<div class="surface kpi"><div class="t">${escapeHtml(w.title)}</div><div class="big">${v.txt}</div>${dl}</div>`);
  }
  if (w.type === "line" || w.type === "bar" || w.type === "combo" || w.type === "area") {
    const labels = axisFor(w);
    const kind = kindOf(w.title, w.fmt);
    const base = kind === "money" ? 1.4e7 : kind === "num" ? 2.2e5 : 80;
    const names = (w.series && w.series.length ? w.series : ["Series 1", "Series 2"]).slice(0, 4);
    const sers = names.map(n => ({ name: n, data: seriesFor(n, labels.length, base) }));
    return wrap(`<div class="surface"><div class="t">${escapeHtml(w.title)}</div>${lineChart(labels, sers, w.type === "bar" ? "bar" : "line")}</div>`);
  }
  if (w.type === "table" || w.type === "pivot") {
    const cols = (w.columns && w.columns.length ? w.columns : ["Item", "Value"]).slice(0, 8);
    const rows = Array.from({ length: 5 }, (_, r) => cols.map((c, ci) => ci === 0 ? `Row ${r + 1}` : fmtNum(rnd() * 1e5)));
    const head = cols.map(c => `<th>${escapeHtml(c)}</th>`).join("");
    const body = rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
    return wrap(`<div class="surface"><div class="t">${escapeHtml(w.title || "Table")}</div><div class="tbl"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`);
  }
  return wrap(`<div class="surface"><div class="t">${escapeHtml(w.title || w.type)}</div><div class="ph">${w.type === "custom-vega-viz" ? "Custom visual (Vega) · placeholder" : "Placeholder"}</div></div>`);
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- tabs ----------
const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");
PAGES.forEach((pg, i) => {
  const b = document.createElement("button");
  b.setAttribute("role", "tab");
  b.setAttribute("aria-selected", i === 0);
  b.textContent = pg.name;
  b.onclick = () => select(i);
  tabsEl.appendChild(b);
  const s = document.createElement("section");
  s.className = "panel" + (i === 0 ? " active" : "");
  const maxRow = Math.max(...pg.widgets.map(w => w.y + w.h), 1);
  s.innerHTML = `<div class="grid" style="grid-template-rows: repeat(${maxRow}, 34px);">` +
    pg.widgets.map((w, k) => renderWidget(w, k)).join("") + `</div>`;
  mainEl.appendChild(s);
});
function select(i) {
  [...tabsEl.children].forEach((b, j) => b.setAttribute("aria-selected", j === i));
  [...mainEl.children].forEach((s, j) => s.classList.toggle("active", j === i));
  tabsEl.children[i].scrollIntoView({ block: "nearest", inline: "nearest" });
}
</script>
</body>
</html>
